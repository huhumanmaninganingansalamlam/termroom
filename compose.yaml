services:
  termroom:
    profiles:
      - core
    image: ghcr.io/huhumanmaninganingansalamlam/termroom:${TERMROOM_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TERMROOM_MODE: core
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - termroom-config:/config
      - "${TERMROOM_WORKSPACES_HOST_PATH:-./workspaces}:/workspaces"

  termroom-node:
    profiles:
      - node
    image: ghcr.io/huhumanmaninganingansalamlam/termroom:${TERMROOM_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TERMROOM_MODE: node
    volumes:
      - termroom-config:/config
      - "${TERMROOM_WORKSPACES_HOST_PATH:-./workspaces}:/workspaces"

volumes:
  termroom-config:
