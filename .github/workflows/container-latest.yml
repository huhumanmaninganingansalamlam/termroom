name: Publish latest container

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/container-latest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-latest
  cancel-in-progress: true

jobs:
  container:
    name: Test and publish GHCR latest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify package exists on PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: curl --fail --silent --show-error "https://pypi.org/pypi/termroom/${VERSION}/json" >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          build-args: |
            TERMROOM_VERSION=${{ steps.version.outputs.version }}
          tags: termroom-latest-smoke
          cache-from: type=gha

      - name: Smoke-test package and unpaired Node wait
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --entrypoint python termroom-latest-smoke -c \
            "import importlib.metadata as m; assert m.version('termroom') == '${VERSION}'"
          docker run --rm --entrypoint termroom termroom-latest-smoke --help >/dev/null

          docker run -d --name termroom-node-wait \
            -e TERMROOM_MODE=node termroom-latest-smoke
          trap 'docker rm -f termroom-node-wait >/dev/null 2>&1 || true' EXIT
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' termroom-node-wait)" = true
          docker logs termroom-node-wait 2>&1 | grep -q "Waiting for pairing configuration"
          docker exec -u termroom termroom-node-wait test -w /config
          docker exec -u termroom termroom-node-wait \
            termroom node --config-dir /config/node pair --help >/dev/null

          docker exec -u termroom termroom-node-wait python -c \
            'from pathlib import Path; from termroom.node_agent import NodeConfig, ensure_node_identity, save_node_config; state = Path("/config/node"); ensure_node_identity(state); save_node_config(state, NodeConfig("http://127.0.0.1:9", "a" * 32, "smoke", (Path("/workspaces"),), state))'
          for attempt in $(seq 1 20); do
            if docker logs termroom-node-wait 2>&1 | \
                grep -q "Pairing configuration found. Starting Termroom Node." && \
                docker exec -u termroom termroom-node-wait \
                test -f /config/node/node-runtime.json; then
              break
            fi
            test "$attempt" -lt 20
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Running}}' termroom-node-wait)" = true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish latest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TERMROOM_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
