name: Release to PyPI and GHCR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test release candidate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} must match package version {expected!r}")
          print(f"Releasing termroom {version}")
          PY

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/termroom-release-smoke
          /tmp/termroom-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/termroom-release-smoke/bin/termroom --help >/dev/null

      - name: Store distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/termroom

    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  container:
    name: Publish container to GHCR
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for the PyPI release to become available
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/termroom/${VERSION}/json" >/dev/null; then
              exit 0
            fi
            echo "Waiting for termroom ${VERSION} on PyPI (${attempt}/60)..."
            sleep 5
          done
          echo "termroom ${VERSION} did not become available on PyPI in time" >&2
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Smoke-test PyPI-based container
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --build-arg "TERMROOM_VERSION=${VERSION}" \
            --tag termroom-release-smoke .
          docker run --rm --entrypoint python termroom-release-smoke -c \
            "import importlib.metadata as m; assert m.version('termroom') == '${VERSION}'"
          docker run --rm --entrypoint termroom termroom-release-smoke --help >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TERMROOM_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
