<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{ title }} · Termroom</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="/static/manifest.webmanifest?v=2">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=12">
  <script>
    window.TermroomLocale = {{ locale | tojson }};
    window.TermroomI18n = {{ i18n_messages | tojson }};
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="/" aria-label="{{ t('app.home') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 7l5 5-5 5M13 17h5"/></svg>
        </span>
        <span>Termroom</span>
      </a>
      <span class="header-actions">
        <label class="language-select" aria-label="{{ t('app.language') }}">
          <select data-language-select>
            {% for code, label in languages.items() %}
            <option value="{{ code }}" {% if code == locale %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <span class="product-tag {{ access_scope_class }}">
          <span class="status-dot"></span>{{ t(access_scope_label) }}
        </span>
        {% if authenticated %}
        <form class="header-logout" method="post" action="/logout">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <button class="header-utility-button" type="submit" aria-label="{{ t('home.logout') }}" title="{{ t('home.logout') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6H6v12h4M14 8l4 4-4 4M18 12H9"/></svg>
            <span>{{ t('home.logout') }}</span>
          </button>
        </form>
        {% endif %}
      </span>
    </div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="{{ url_for('static', path='app.js') }}?v=42" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
