<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#212830">
  <script>
    (() => {
      const storageKey = "termroom.theme";
      let savedTheme = null;
      try {
        const value = window.localStorage.getItem(storageKey);
        if (value === "dark" || value === "light") savedTheme = value;
      } catch {
        // Storage is optional. The system preference still applies.
      }
      const systemTheme = window.matchMedia?.("(prefers-color-scheme: light)").matches
        ? "light"
        : "dark";
      const theme = savedTheme || systemTheme;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        "content",
        theme === "light" ? "#d9d6ce" : "#212830",
      );
      window.TermroomInitialTheme = { theme, preference: savedTheme || "system" };
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{ title }} · Termroom</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="/static/manifest.webmanifest?v=3">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=19">
  <script>
    window.TermroomLocale = {{ locale | tojson }};
    window.TermroomI18n = {{ i18n_messages | tojson }};
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="/" aria-label="{{ t('app.home') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 7l5 5-5 5M13 17h5"/></svg>
        </span>
        <span>Termroom</span>
      </a>
      <span class="header-actions">
        <button class="theme-toggle"
                type="button"
                data-theme-toggle
                aria-label="{{ t('app.theme') }}"
                title="{{ t('app.theme') }}">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.4A8.2 8.2 0 0 1 8.6 4a8.2 8.2 0 1 0 11.4 11.4Z"/></svg>
        </button>
        <label class="language-select" aria-label="{{ t('app.language') }}">
          <select data-language-select>
            {% for code, label in languages.items() %}
            <option value="{{ code }}" {% if code == locale %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <span class="product-tag {{ access_scope_class }}">
          <span class="status-dot"></span>{{ t(access_scope_label) }}
        </span>
        {% if authenticated %}
        <form class="header-logout" method="post" action="/logout">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <button class="header-utility-button" type="submit" aria-label="{{ t('home.logout') }}" title="{{ t('home.logout') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6H6v12h4M14 8l4 4-4 4M18 12H9"/></svg>
            <span>{{ t('home.logout') }}</span>
          </button>
        </form>
        {% endif %}
      </span>
    </div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <template id="theme-toggle-template">
    <button class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="{{ t('app.theme') }}"
            title="{{ t('app.theme') }}">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.4A8.2 8.2 0 0 1 8.6 4a8.2 8.2 0 1 0 11.4 11.4Z"/></svg>
    </button>
  </template>
  <script src="{{ url_for('static', path='app.js') }}?v=47" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
